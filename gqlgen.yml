schema:
  - graph/schema.graphqls
exec:
  filename: graph/generated/generated.go
  package: generated
model:
  filename: graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"
models:
  Tenant:
    model: github.com/clinicmanager/services/tenant/db.BunTenant
  Branch:
    model: github.com/clinicmanager/services/tenant/db.BunBranch
  Address:
    model: github.com/clinicmanager/services/tenant/db.BunAddress
  TenantRole:
    model: github.com/clinicmanager/services/tenant/db.BunTenantRole
  TenantPermission:
    model: github.com/clinicmanager/services/tenant/db.BunTenantPermission
  Module:
    model: github.com/clinicmanager/services/tenant/db.BunModule
  Patient:
    model: github.com/clinicmanager/services/patient/db.BunPatients
  PatientAddress:
    model: github.com/clinicmanager/services/patient/db.BunPatientAddress
  Guardian:
    model: github.com/clinicmanager/services/patient/db.BunGuardians
  Goal:
    model: github.com/clinicmanager/services/patient/db.BunGoal
  BranchHours:
    model: github.com/clinicmanager/services/booking/db.BunBranchHours
  PractitionerBranch:
    model: github.com/clinicmanager/services/booking/db.BunPractitionerBranch
  PractitionerAvailability:
    model: github.com/clinicmanager/services/booking/db.BunPractitionerAvailability
  ScheduleTemplate:
    model: github.com/clinicmanager/services/booking/db.BunScheduleTemplate
  AppointmentType:
    model: github.com/clinicmanager/services/booking/db.BunAppointmentType
  TherapyDiscipline:
    model: github.com/clinicmanager/services/booking/db.BunTherapyDiscipline
  AppointmentSlot:
    model: github.com/clinicmanager/services/booking/db.BunAppointmentSlot
  Appointment:
    model: github.com/clinicmanager/services/booking/db.BunAppointment
  AppointmentGoal:
    model: github.com/clinicmanager/services/booking/db.BunAppointmentGoal
  SoapNote:
    model: github.com/clinicmanager/services/booking/db.BunSoapNote
  ScheduleException:
    model: github.com/clinicmanager/services/booking/db.BunScheduleException
  MessageThread:
    model: github.com/clinicmanager/services/messaging/db.BunMessageThread
  Message:
    model: github.com/clinicmanager/services/messaging/db.BunMessage
  MessageParticipant:
    model: github.com/clinicmanager/services/messaging/db.BunMessageParticipant
  DateTime:
    model: github.com/99designs/gqlgen/graphql.String
